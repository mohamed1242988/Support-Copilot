<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Support Copilot</title>

    <!-- Markdown renderer -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: #17202a;
            color: white;
            display: flex;
            flex-direction: column;
            padding: 22px 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 4px 8px 28px;
        }

        .logo {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: #3b82f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }

        .brand-text {
            font-size: 18px;
            font-weight: 600;
        }

        .new-chat {
            border: 1px solid #394654;
            background: #222e3a;
            color: white;
            padding: 11px 14px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 14px;
            text-align: left;
            transition: 0.2s;
        }

        .new-chat:hover {
            background: #2d3b49;
        }

        .sidebar-bottom {
            margin-top: auto;
            padding: 10px 8px;
            font-size: 12px;
            color: #9ca8b5;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
        }

        /* Main */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .header {
            height: 64px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            padding: 0 28px;
        }

        .header-title {
            font-size: 17px;
            font-weight: 600;
        }

        .header-subtitle {
            margin-left: 10px;
            color: #8a94a3;
            font-size: 13px;
        }

        /* Chat */
        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 32px 20px;
        }

        .messages {
            max-width: 900px;
            margin: auto;
        }

        .welcome {
            text-align: center;
            margin-top: 12vh;
            color: #64748b;
        }

        .welcome h1 {
            color: #1f2937;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .welcome p {
            margin: 0;
            font-size: 15px;
        }

        .message {
            display: flex;
            margin-bottom: 24px;
            gap: 12px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .avatar {
            width: 34px;
            height: 34px;
            flex-shrink: 0;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
        }

        .assistant .avatar {
            background: #dbeafe;
            color: #2563eb;
        }

        .user .avatar {
            background: #e5e7eb;
            color: #4b5563;
            order: 2;
        }

        .bubble {
            max-width: 80%;
            padding: 13px 16px;
            border-radius: 14px;
            line-height: 1.6;
            font-size: 14px;
        }

        .assistant .bubble {
            background: white;
            border: 1px solid #e5e7eb;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }

        .user .bubble {
            background: #2563eb;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .assistant .bubble {
            border-bottom-left-radius: 4px;
        }

        /* Markdown */
        .bubble p {
            margin: 0 0 10px;
        }

        .bubble p:last-child {
            margin-bottom: 0;
        }

        .bubble strong {
            font-weight: 650;
        }

        .bubble ul,
        .bubble ol {
            margin: 8px 0;
            padding-left: 24px;
        }

        .bubble li {
            margin: 5px 0;
        }

        .bubble h1,
        .bubble h2,
        .bubble h3 {
            margin: 14px 0 8px;
        }

        .bubble h1:first-child,
        .bubble h2:first-child,
        .bubble h3:first-child {
            margin-top: 0;
        }

        .bubble code {
            background: #f1f5f9;
            padding: 2px 5px;
            border-radius: 4px;
            font-size: 13px;
        }

        .bubble pre {
            background: #111827;
            color: #e5e7eb;
            padding: 14px;
            border-radius: 8px;
            overflow-x: auto;
        }

        .bubble pre code {
            background: none;
            padding: 0;
        }

        .bubble table {
            border-collapse: collapse;
            width: 100%;
            margin: 12px 0;
            font-size: 13px;
        }

        .bubble th,
        .bubble td {
            border: 1px solid #dbe1e8;
            padding: 7px 9px;
            text-align: left;
        }

        .bubble th {
            background: #f1f5f9;
            font-weight: 600;
        }

        /* Input */
        .input-area {
            background: white;
            border-top: 1px solid #e5e7eb;
            padding: 16px 20px 20px;
        }

        .input-container {
            max-width: 900px;
            margin: auto;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        textarea {
            flex: 1;
            resize: none;
            min-height: 48px;
            max-height: 150px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            padding: 13px 14px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }

        textarea:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }

        button.send {
            height: 48px;
            padding: 0 20px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        button.send:hover {
            background: #1d4ed8;
        }

        button.send:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .thinking {
            color: #64748b;
            font-style: italic;
        }

        @media (max-width: 700px) {
            .sidebar {
                display: none;
            }

            .bubble {
                max-width: 90%;
            }

            .header {
                padding: 0 16px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="brand">
            <div class="logo">✦</div>
            <div class="brand-text">Support Copilot</div>
        </div>

        <button class="new-chat" onclick="newChat()">
            ＋ New conversation
        </button>

        <div class="sidebar-bottom">
            <div class="status">
                <span class="status-dot"></span>
                Knowledge Engine online
            </div>
        </div>

    </aside>


    <main class="main">

        <header class="header">
            <span class="header-title">AI Support Assistant</span>
            <span class="header-subtitle">
                Freshdesk · Jira · Knowledge Engine
            </span>
        </header>


        <section class="chat" id="chat">

            <div class="messages" id="messages">

                <div class="welcome" id="welcome">
                    <h1>How can I help?</h1>
                    <p>
                        Ask about tickets, customers, incidents, or support history.
                    </p>
                </div>

            </div>

        </section>


        <div class="input-area">

            <div class="input-container">

                <textarea
                    id="message"
                    placeholder="Ask Support Copilot..."
                    rows="1"
                ></textarea>

                <button
                    class="send"
                    id="send"
                    onclick="sendMessage()"
                >
                    Send
                </button>

            </div>

        </div>

    </main>

</div>


<script>

    let history = [];

    const messageInput = document.getElementById("message");
    const sendButton = document.getElementById("send");
    const messages = document.getElementById("messages");
    const welcome = document.getElementById("welcome");


    function addMessage(role, text) {

        if (welcome) {
            welcome.style.display = "none";
        }

        const message = document.createElement("div");
        message.className = `message ${role}`;

        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = role === "user" ? "You" : "AI";

        const bubble = document.createElement("div");
        bubble.className = "bubble";

        if (role === "assistant") {
            // Render Markdown returned by the AI
            bubble.innerHTML = marked.parse(text);
        } else {
            bubble.textContent = text;
        }

        message.appendChild(avatar);
        message.appendChild(bubble);

        messages.appendChild(message);

        scrollToBottom();
    }


    function addThinking() {

        const message = document.createElement("div");
        message.className = "message assistant";
        message.id = "thinking";

        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = "AI";

        const bubble = document.createElement("div");
        bubble.className = "bubble thinking";
        bubble.textContent = "Thinking...";

        message.appendChild(avatar);
        message.appendChild(bubble);

        messages.appendChild(message);

        scrollToBottom();
    }


    function removeThinking() {

        const thinking = document.getElementById("thinking");

        if (thinking) {
            thinking.remove();
        }
    }


    async function sendMessage() {

        const message = messageInput.value.trim();

        if (!message || sendButton.disabled) {
            return;
        }

        addMessage("user", message);

        messageInput.value = "";
        messageInput.style.height = "48px";

        sendButton.disabled = true;
        sendButton.textContent = "Sending...";

        addThinking();

        try {

            const response = await fetch("/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: message,
                    history: history
                })
            });

            if (!response.ok) {
                throw new Error("Server returned an error");
            }

            const data = await response.json();

            removeThinking();

            addMessage("assistant", data.answer);

            history = data.history;

        } catch (error) {

            removeThinking();

            addMessage(
                "assistant",
                "⚠️ Sorry, something went wrong while processing your request."
            );

            console.error(error);

        } finally {

            sendButton.disabled = false;
            sendButton.textContent = "Send";

            messageInput.focus();
        }
    }


    function newChat() {

        history = [];

        messages.innerHTML = `
            <div class="welcome" id="welcome">
                <h1>How can I help?</h1>
                <p>
                    Ask about tickets, customers, incidents, or support history.
                </p>
            </div>
        `;

        messageInput.value = "";
        messageInput.focus();
    }


    function scrollToBottom() {

        const chat = document.getElementById("chat");

        setTimeout(() => {
            chat.scrollTop = chat.scrollHeight;
        }, 50);
    }


    // Enter = send
    // Shift + Enter = new line
    messageInput.addEventListener("keydown", function(event) {

        if (event.key === "Enter" && !event.shiftKey) {

            event.preventDefault();
            sendMessage();

        }

    });


    // Automatically grow textarea
    messageInput.addEventListener("input", function() {

        this.style.height = "auto";
        this.style.height = Math.min(this.scrollHeight, 150) + "px";

    });

</script>

</body>
</html>
